<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102a43">
    <title>You're offline</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(165deg, #f8fafc 0%, #eef2ff 50%, #fff7ed 100%);
            color: #0f172a;
        }
        .card {
            width: min(22rem, 100%);
            padding: 1.75rem 1.5rem;
            border-radius: 1.25rem;
            background: #fff;
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.06), 0 18px 40px -24px rgb(15 23 42 / 0.35);
            text-align: center;
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1rem;
            border-radius: 1rem;
            display: grid;
            place-items: center;
            background: #fff7ed;
            color: #d97706;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0.65rem 0 0;
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #64748b;
        }
        button {
            margin-top: 1.25rem;
            width: 100%;
            min-height: 2.75rem;
            border: 0;
            border-radius: 0.85rem;
            background: #102a43;
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">
            <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 1 15.54-6.36M21 12a9 9 0 0 1-15.54 6.36M8 12h8"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>This app needs an internet connection to load school data. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
